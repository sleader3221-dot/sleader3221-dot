<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="ProofSIFT">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
  <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset=".6" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .t { font: 800 27px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#e5e7eb; }
  .s { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#22d3ee; }
  .d { font: 400 14.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#94a3b8; }
  .chip { font: 600 12px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#e5e7eb; }
  .badge { font: 700 11.5px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#fbbf24; letter-spacing:.6px; }
  .ring { animation: spin 14s linear infinite; transform-origin: 548px 50px; }
  .scan { animation: scan 5s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes scan { 0%,100% { transform: translateX(0); opacity:0; } 15% { opacity:.6; } 50% { transform: translateX(560px); opacity:0; } }
</style>
<rect x="1" y="1" width="598" height="248" rx="16" fill="#0d1424"/>
<rect x="1" y="1" width="598" height="248" rx="16" fill="url(#g)"/>
<rect class="scan" x="20" y="2" width="40" height="3" rx="1.5" fill="#22d3ee"/>
<rect x="1" y="1" width="598" height="248" rx="16" fill="none" stroke="url(#b)" stroke-width="1.6"/>
<g transform="translate(28 22)"><rect width="242" height="24" rx="6" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/>
  <text x="121.0" y="16.5" text-anchor="middle" class="badge">3RD PLACE  ·  SANS “FIND EVIL”</text></g>
<circle class="ring" cx="548" cy="50" r="30" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-dasharray="6 8"/>
<g transform="translate(548 50)" stroke="#22d3ee"><path d="M0 -16 L13 -10 V1 C13 9 7 14 0 17 C-7 14 -13 9 -13 1 V-10 Z" fill="none" stroke-width="2.2"/><path d="M-5 0 L-1 4 L6 -4" fill="none" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="28" y="88" class="t">ProofSIFT</text>
<text x="28" y="112" class="s">Autonomous DFIR Triage Agent</text>
<text y="142" class="d"><tspan x="28" dy="0">Triage engine linking every finding to forensic artifacts, timestamps</tspan><tspan x="28" dy="21">and SHA-256 hashes; correlates memory, disk, EVTX, PowerShell, YARA</tspan><tspan x="28" dy="21">and network evidence into an SQLite evidence graph.</tspan></text>
<g transform="translate(28 206)"><rect width="66" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="33.0" y="17.5" text-anchor="middle" class="chip">Python</text></g><g transform="translate(102 206)"><rect width="96" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="48.0" y="17.5" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(206 206)"><rect width="66" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="33.0" y="17.5" text-anchor="middle" class="chip">SQLite</text></g><g transform="translate(280 206)"><rect width="110" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="55.0" y="17.5" text-anchor="middle" class="chip">MITRE ATT&amp;CK</text></g>
</svg>
