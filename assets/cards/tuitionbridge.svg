<text x="28" y="88" class="t">TuitionBridge</text>
<text x="28" y="112" class="s">Cross-Border Tuition Payment Agent</text>
<text y="142" class="d"><tspan x="28" dy="0">A simulated agent that handles cross-border tuition payments end to</tspan><tspan x="28" dy="21">end, built for the 2026 FinTechathon.</tspan></text>
