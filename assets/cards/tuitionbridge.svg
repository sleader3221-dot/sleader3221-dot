<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="TuitionBridge">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
  <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".22"/><stop offset=".6" stop-color="#34d399" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .t { font: 800 27px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#e5e7eb; }
  .s { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#34d399; }
  .d { font: 400 14.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#94a3b8; }
  .chip { font: 600 12px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#e5e7eb; }
  .badge { font: 700 11.5px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#22d3ee; letter-spacing:.6px; }
  .ring { animation: spin 14s linear infinite; transform-origin: 548px 50px; }
  .scan { animation: scan 5s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes scan { 0%,100% { transform: translateX(0); opacity:0; } 15% { opacity:.6; } 50% { transform: translateX(560px); opacity:0; } }
</style>
<rect x="1" y="1" width="598" height="248" rx="16" fill="#0d1424"/>
<rect x="1" y="1" width="598" height="248" rx="16" fill="url(#g)"/>
