  <text x="74.0" y="16.5" text-anchor="middle" class="badge">FINTECHATHON 2026</text></g>
<circle class="ring" cx="548" cy="50" r="30" fill="none" stroke="#34d399" stroke-opacity=".5" stroke-dasharray="6 8"/>
