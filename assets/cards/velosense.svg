<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="VeloSense">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
  <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset=".6" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .t { font: 800 27px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#e5e7eb; }
  .s { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#a78bfa; }
  .d { font: 400 14.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#94a3b8; }
  .chip { font: 600 12px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#e5e7eb; }
  .badge { font: 700 11.5px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#34d399; letter-spacing:.6px; }
  .ring { animation: spin 14s linear infinite; transform-origin: 548px 50px; }
  .scan { animation: scan 5s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes scan { 0%,100% { transform: translateX(0); opacity:0; } 15% { opacity:.6; } 50% { transform: translateX(560px); opacity:0; } }
</style>
<rect x="1" y="1" width="598" height="248" rx="16" fill="#0d1424"/>
<rect x="1" y="1" width="598" height="248" rx="16" fill="url(#g)"/>
<rect class="scan" x="20" y="2" width="40" height="3" rx="1.5" fill="#a78bfa"/>
<rect x="1" y="1" width="598" height="248" rx="16" fill="none" stroke="url(#b)" stroke-width="1.6"/>
<g transform="translate(28 22)"><rect width="270" height="24" rx="6" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/>
  <text x="135.0" y="16.5" text-anchor="middle" class="badge">FINALIST ENTRY  ·  SEVA FIRST 2026</text></g>
<circle class="ring" cx="548" cy="50" r="30" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="6 8"/>
<g transform="translate(548 50)" stroke="#a78bfa"><rect x="-10" y="-10" width="20" height="20" rx="3" fill="none" stroke-width="2.2"/><path d="M-5 -10V-16M0 -10V-16M5 -10V-16M-5 10V16M0 10V16M5 10V16M-10 -5H-16M-10 0H-16M-10 5H-16M10 -5H16M10 0H16M10 5H16" stroke-width="2"/></g>
<text x="28" y="88" class="t">VeloSense</text>
<text x="28" y="112" class="s">Retrofit Blind-Spot Warning System</text>
<text y="142" class="d"><tspan x="28" dy="0">ESP32 prototype grading adjacent-lane distance every 100 ms into SAFE</tspan><tspan x="28" dy="21">/ WARNING / DANGER zones, with haptics and a Bluetooth app. Gen 1 two-</tspan><tspan x="28" dy="21">layer PCB with dual 24 GHz radar and IMU.</tspan></text>
