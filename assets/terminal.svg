<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About Karthik">
<style>
  .p { font: 600 15px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#22d3ee; }
  .c { font: 600 15px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#e5e7eb; }
  .o { font: 400 15px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#94a3b8; }
  .ln { opacity:0; animation: show .01s forwards; }
  .type { transform-box: fill-box; transform-origin: right center; animation-name: type; animation-fill-mode: both; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes show { to { opacity:1; } }
  @keyframes type { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes blink { 50% { opacity:0; } }
</style>
<defs>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="358" rx="14" fill="#0d1424" stroke="url(#edge)" stroke-opacity=".5"/>
<rect x="1" y="1" width="1198" height="38" rx="14" fill="#111a2e"/>
<rect x="1" y="26" width="1198" height="13" fill="#111a2e"/>
<circle cx="26" cy="20" r="6.5" fill="#ff5f57"/><circle cx="48" cy="20" r="6.5" fill="#febc2e"/><circle cx="70" cy="20" r="6.5" fill="#28c840"/>
<text x="600" y="25" text-anchor="middle" style="font:500 13px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill:#94a3b8">karthik@ramaiah: ~/profile  -  zsh</text>
<g>
  <g class="ln" style="animation-delay:0.40s"><text x="32" y="70" class="p">karthik@ramaiah:~$ </text><text x="203" y="70" class="c">whoami</text><rect x="201" y="52" width="68" height="26" fill="#0d1424" class="type" style="animation-delay:0.40s;animation-duration:0.50s;animation-timing-function:steps(6)"/></g>
  <text x="32" y="100" class="o ln" style="animation-delay:1.15s"><tspan fill="#34d399">&#8627; </tspan>Karthik M Achalakar  -  B.E. Electrical &amp; Electronics, Ramaiah Institute of Technology (2024-28)</text>
  <g class="ln" style="animation-delay:1.70s"><text x="32" y="130" class="p">karthik@ramaiah:~$ </text><text x="203" y="130" class="c">cat focus.txt</text><rect x="201" y="112" width="131" height="26" fill="#0d1424" class="type" style="animation-delay:1.70s;animation-duration:0.91s;animation-timing-function:steps(13)"/></g>
  <text x="32" y="160" class="o ln" style="animation-delay:2.86s"><tspan fill="#34d399">&#8627; </tspan>Building across the hardware-software boundary: ESP32 firmware, 12 V power design, production web apps</text>
  <g class="ln" style="animation-delay:3.41s"><text x="32" y="190" class="p">karthik@ramaiah:~$ </text><text x="203" y="190" class="c">./now --role</text><rect x="201" y="172" width="122" height="26" fill="#0d1424" class="type" style="animation-delay:3.41s;animation-duration:0.84s;animation-timing-function:steps(12)"/></g>
  <text x="32" y="220" class="o ln" style="animation-delay:4.50s"><tspan fill="#34d399">&#8627; </tspan>Full Stack Engineer Intern @ DukaanSe  -&gt;  Next.js, MERN, APIs, databases</text>
  <g class="ln" style="animation-delay:5.05s"><text x="32" y="250" class="p">karthik@ramaiah:~$ </text><text x="203" y="250" class="c">ls ./achievements</text><rect x="201" y="232" width="167" height="26" fill="#0d1424" class="type" style="animation-delay:5.05s;animation-duration:1.19s;animation-timing-function:steps(17)"/></g>
  <text x="32" y="280" class="o ln" style="animation-delay:6.49s"><tspan fill="#34d399">&#8627; </tspan>3rd SANS 'Find Evil'  ·  2nd HackMars 3.0 NEON  ·  Rank 22 NIT Jamshedpur FPGA  ·  52 hackathons</text>
  <g class="ln" style="animation-delay:7.04s"><text x="32" y="310" class="p">karthik@ramaiah:~$ </text><rect x="203" y="294" width="10" height="20" fill="#22d3ee" class="cursor"/></g>
</g>
</svg>
